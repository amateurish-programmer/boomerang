name: Verify and build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      device_apis:
        description: 'Android API levels: full acceptance or focused reproduction'
        type: choice
        options:
          - '[26,33,35]'
          - '[26]'
          - '[35]'
        default: '[26,33,35]'
      trace_host_exit:
        description: 'Diagnostic only: trace API35 host emulator exit signals (not acceptance)'
        type: boolean
        default: false
      trace_host_fault:
        description: 'Diagnostic only: collect API35 host fault frame metadata (not acceptance)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: isolated-ci-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate API contract
        run: node scripts/check-contract.mjs
      - name: Validate inactive research scheduler
        shell: pwsh
        run: ./scripts/test-research-cron.ps1
      - name: Test AI request boundaries
        run: node --test scripts/test-ai.mjs
      - name: Test ink motion lifecycle
        run: node --test scripts/test-ink-motion.mjs
      - name: Test bounded emulator crash metadata
        run: node --test scripts/test-emulator-crash.mjs
      - name: Test OTA release boundaries
        run: node --test scripts/test-ota.mjs
      - name: Apply migrations and test database boundaries
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          for migration in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$migration"; done
          for test in supabase/tests/*_test.sql; do psql -v ON_ERROR_STOP=1 -f "$test"; done
      - name: Test research and leased jobs against isolated PostgreSQL
        env:
          RESEARCH_SQL_URL: postgresql://postgres:isolated-ci-only@localhost:5432/postgres
        run: node --test scripts/test-research.mjs
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and compile
        run: bash android/gradlew -p android testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: boomerang-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports-${{ github.run_number }}
          path: android/app/build/reports/
  device:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(inputs.device_apis || '[26,33,35]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INK_TRACE_HOST_EXIT: ${{ inputs.trace_host_exit == true && matrix.api == 35 && '1' || '0' }}
      INK_TRACE_HOST_FAULT: ${{ inputs.trace_host_fault == true && matrix.api == 35 && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure optional host exit tracer on ephemeral CI runner
        if: inputs.trace_host_exit == true && inputs.trace_host_fault != true && matrix.api == 35
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          if ! command -v strace >/dev/null 2>&1; then
            if ! sudo -n apt-get install --no-install-recommends -y strace; then
              echo 'Host exit tracer unavailable: CI package installation failed; device tests continue.'
            fi
          fi
          probe_sticky=
          probe_dir=
          cleanup_output_probe() {
            local code=0
            if [[ -n "$probe_sticky" ]]; then
              rm -f -- "$probe_sticky" 2>/dev/null || code=$?
            fi
            if [[ -n "$probe_dir" ]]; then
              rm -f -- "$probe_dir/output" "$probe_dir/stderr" 2>/dev/null || code=$?
              rmdir -- "$probe_dir" 2>/dev/null || code=$?
            fi
            printf 'host-exit-output-probe cleanup_exit=%s\n' "$code"
            return 0
          }
          trap 'probe_step_exit=$?; cleanup_output_probe; exit "$probe_step_exit"' EXIT
          probe_root_open() {
            local location="$1" path="$2" code=0 result=unclassified
            LC_ALL=C timeout --kill-after=1s 9s sudo -n bash -c 'printf "%s\n" probe > "$1"' ink-host-exit-probe "$path" >/dev/null 2> "$probe_dir/stderr" || code=$?
            if [[ "$code" -eq 0 ]]; then
              result=open_ok
            elif [[ "$code" -eq 124 || "$code" -eq 137 ]]; then
              result=timeout_or_killed
            elif grep -qi 'permission denied' "$probe_dir/stderr" 2>/dev/null; then
              result=permission_denied
            fi
            printf 'host-exit-output-probe location=%s result=%s exit=%s\n' "$location" "$result" "$code"
          }
          probe_output_access() {
            local protected_value=unavailable
            protected_value=$(timeout --kill-after=1s 9s cat /proc/sys/fs/protected_regular 2>/dev/null) || protected_value=unavailable
            [[ "$protected_value" =~ ^[0-9]+$ ]] || protected_value=unavailable
            printf 'host-exit-output-probe protected_regular=%s\n' "$protected_value"
            probe_dir=$(umask 077; mktemp -d /tmp/ink-host-exit-probe.XXXXXX 2>/dev/null) || {
              echo 'host-exit-output-probe result=unavailable reason=private-directory-creation'
              return 0
            }
            if ! (umask 077; : > "$probe_dir/output" && : > "$probe_dir/stderr") 2>/dev/null; then
              echo 'host-exit-output-probe result=unavailable reason=private-file-creation'
              return 0
            fi
            probe_sticky=$(umask 077; mktemp /tmp/ink-host-exit-probe.XXXXXX 2>/dev/null) || {
              echo 'host-exit-output-probe result=unavailable reason=sticky-file-creation'
              return 0
            }
            # Actual root O_CREAT opens, fixed content and positional owned paths.
            # Each command has a 9s + 1s bound; failures never block device tests.
            probe_root_open sticky-tmp "$probe_sticky"
            probe_root_open private-directory "$probe_dir/output"
            return 0
          }
          probe_output_access
      - name: Ensure optional host fault observer on ephemeral CI runner
        if: inputs.trace_host_fault == true && matrix.api == 35
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          if ! command -v gdb >/dev/null 2>&1; then
            if ! sudo -n apt-get install --no-install-recommends -y gdb; then
              echo 'Host fault observer unavailable: CI package installation failed; device tests continue.'
            fi
          fi
      - name: Free unused native toolchains on ephemeral runner
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sdk_path=$(realpath "$ANDROID_HOME")
          test "$sdk_path" = /usr/local/lib/android/sdk
          # This Kotlin-only project does not build NDK components.
          if [ -d "$sdk_path/ndk" ]; then
            du -sh "$sdk_path/ndk"
            rm -rf -- "$sdk_path/ndk"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile device APKs before starting emulator
        run: |
          bash android/gradlew -p android assembleDebug assembleDebugAndroidTest --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process
          bash android/gradlew -p android --stop
          df -h "$HOME" "$ANDROID_HOME"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disk-size: 2048M
          emulator-options: -no-window -gpu ${{ matrix.api == 35 && 'swiftshader' || 'swiftshader_indirect' }} -no-snapshot -noaudio -no-boot-anim ${{ matrix.api == 35 && '-feature -Vulkan' || '' }}
          disable-animations: true
          script: bash scripts/test-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-api${{ matrix.api }}-reports-${{ github.run_number }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/permission-reports/
